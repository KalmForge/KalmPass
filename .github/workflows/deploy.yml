name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a queued run should supersede, not race.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check punctuation
        run: npm run lint:copy

      # A password manager that does not compile is not going anywhere near
      # production, so this gates the deploy rather than running beside it.
      - name: Check shared libraries
        run: npm run lint:libs

      - name: Typecheck
        run: npm run typecheck

      # The extension ships separately, but a build that Mozilla would reject
      # should be caught here rather than at upload.
      - name: Build and lint the extensions
        run: npm run ext:lint

      - uses: actions/upload-artifact@v4
        with:
          name: extensions
          path: dist/kalmpass-*.zip
          if-no-files-found: error

      # Skipped, not failed, until the repository has a Cloudflare API token.
      # Until then deploys are run by hand with `npm run deploy`.
      - name: Deploy to Cloudflare
        if: ${{ env.HAS_CLOUDFLARE_TOKEN == 'true' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
