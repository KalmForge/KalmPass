name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deployment at a time; a queued run should supersede, not race.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check punctuation
        run: npm run lint:copy

      # A password manager that does not compile is not going anywhere near
      # production, so this gates the deploy rather than running beside it.
      - name: Check shared libraries
        run: npm run lint:libs

      - name: Typecheck
        run: npm run typecheck

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
